runConfig:
  runtime: nodejs20
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  - variable: NOTION_TOKEN
    secret: NOTION_TOKEN@latest
  - variable: NOTION_TOURNAMENTS_DB
    secret: NOTION_TOURNAMENTS_DB@latest
  - variable: NOTION_CLIPPINGS_DB
    secret: NOTION_CLIPPINGS_DB@latest
  - variable: NOTION_PLAYERS_DB
    secret: NOTION_PLAYERS_DB@latest
  - variable: NOTION_MOMENTS_DB
    secret: NOTION_MOMENTS_DB@latest
